name: CI

# Checks every push and pull request. Deploys are done by Dokploy, which builds docker-compose.yml from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          bun run --cwd apps/api typecheck
          bun run --cwd apps/web typecheck

      - name: Test
        run: bun test

      - name: Build
        run: |
          (cd apps/web && VITE_API_URL=/api bunx vite build)
          bun run --cwd apps/api build
